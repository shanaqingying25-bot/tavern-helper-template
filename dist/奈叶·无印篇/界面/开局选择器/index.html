份设定':'卷入圣石之种事件的海鸣市居民','主角.立场':'中立观望','主角.状态':'健康','世界.当前地点':'海鸣市'},text:'海鸣市的黄昏，河堤上吹来的风里，掺着一股不该属于春天的燥热。\n\n<user>正沿着河堤的步道往回走，街灯刚亮。就在经过废弃铁皮告示牌时，远处，对岸旧仓库区的方向，传来一声闷响。不像打雷，也不像货轮靠港。空气骤然绷紧，河面泛起与风无关的细纹，连脚下的人行道都在极轻地发颤。\n\n路人们缩了缩肩膀，只当是远处工地放了哑炮，脚步都没停。\n\n可<user>的脚步停住了。与此同时，对岸天幕边缘忽然亮了一下。那光不属于夕阳：冰冷的青色，像一块小石头在水底被点亮，一闪即灭。紧跟着又是一闪，落在更近的河面上，水面掠过一道微不可察的白光，随即恢复平静。\n\n路堤尽头的路灯闪了闪，又亮回来。\n\n就在<user>盯着河面时，堤岸另一头，一个小小的身影快步跑过。是个小学生模样的女孩，棕色短发，两侧小辫系着发带，怀里抱着什么东西，脚步却稳得不像个孩子。她肩头趴着一只棕色皮毛的小动物，像雪貂，耳朵竖得笔直，正朝着闪光的方向。女孩跑到堤坝尽头的树荫下，忽然停下，回头看了<user>一眼。\n\n那一眼很快，目光在<user>身上停了不到一秒。\n\n她肩上的雪貂却看得久一点。那双绿色小眼睛在渐暗的天光里迎着<user>的视线，定定看了两秒。片刻后，女孩低头跟雪貂说了句什么，抱紧怀里那根银白色的短棒，拐进巷口，消失在旧仓库区，正是闪光落下的地方。\n\n风停了。燥热却还压在空气里。\n\n<user>站在原地，脚底还留着那阵极轻的震颤。河对岸旧仓库区的屋顶，又一团青光无声地亮起，又无声地熄灭。那道光的边缘，正落在<user>脚边。\n\n追上去看看，还是转身往亮着灯的人群里走？',prompt:'你选择「黄昏·河堤」开局。请按上述开场叙事继续：<user> 目击青光后决定追向旧仓库区。请展开后续。'},{id:'street',title:'街头·异象',subtitle:'被圣石之种波及，指尖泛起异样麻痒',group:'被卷入者',icon:'fa-bolt',accent:'#d4a017',patch:{'主角.身份设定':'被圣石之种波及的异能者','主角.立场':'想帮忙','主角.状态':'轻伤','世界.当前地点':'海鸣市商业街'},text:'海鸣市的商业街入夜后本不该冷清，此刻却空了大半。\n\n<user>正站在便利店门口的灯柱下，手心里攥着刚从自动售货机取的热饮。就在那声闷响炸开的前一瞬，空气像被什么东西猛地吸干，街角的电线杆顶突然爆出一团青白色的光。\n\n光落下来的地方离<user>不到三米。\n\n一阵剧烈的麻痒从<user>左手的指尖窜上来，顺着腕骨往小臂爬，像被细小的电流爬过皮肤。热饮脱手砸在地上，溅了<user>一裤脚，<user>却没顾上疼，因为那道青光正悬停在半空，凝成一颗鹌鹑蛋大小的光球，表面流转着不属于任何路灯的光泽。\n\n它朝<user>飘近了一点。\n\n远处传来奔跑的脚步声，还有一个女孩清亮的喊声：「等等！」\n\n可光球已经先一步碰到<user>的指尖。那一瞬，<user>看见无数画面在眼前晃过：碎裂的宝石、翻涌的海浪、还有一座浮在云层里的、陌生的高塔。\n\n当<user>回过神来，光球消失了，左手的麻痒褪去，指尖却泛起一层淡淡的、病态的青色，像针扎过留下的小点。一个棕色短发、肩头趴着雪貂的小学生正站在不远处的路口，怔怔看着<user>的手。',prompt:'你选择「街头·异象」开局。你是被圣石之种波及、拥有微弱异能的异能者。请按上述开场继续：<user> 被光球触及、指尖泛起异样，奈叶与尤诺赶到。请展开后续。'},{id:'visitor',title:'站台·来客',subtitle:'初抵海鸣，刚下电车便被引向闪光',group:'外来者',icon:'fa-train',accent:'#6fa8c9',patch:{'主角.身份设定':'外来访客（旅人）','主角.立场':'先观望','主角.状态':'健康','世界.当前地点':'海鸣市车站'},text:'海鸣站的电车在傍晚六点四十分靠站。<user>踏出车门时，口袋里还揣着一本封面磨旧的车票夹和一张手写的地址。\n\n站台上的人潮很快散去，只剩下<user>站在月台上，对着出站口的方向核对地址。就在<user>低头看手机里的地图时，站台尽头的天空毫无预兆地亮了一下——\n\n那是两栋楼之间的夹缝里，闪过的一道青白色光。\n\n像是什么东西从天上坠下来，砸在那片旧仓库区的屋顶。\n\n<user>还没来得及判断那是不是幻觉，月台上的广播突然发出一声刺耳的电流声，随后是玻璃炸裂似的清脆声响——出站口旁边、便利店橱窗里的一排灯泡同时炸了。\n\n周围几个旅客吓了一跳，慌慌张张往站内退。<user>站在原地没动，因为<user>的视线，正被一个从闸机方向快步走进来的小女孩吸引。\n\n她约莫九岁，棕色短发，两侧小辫系着发带，怀里抱着一根银白色的短棒般的东西。她肩头趴着一只棕色皮毛的雪貂。女孩在站口站定，目光越过<user>，落在刚才闪光的方向，低声对肩上的雪貂说了句什么——\n\n然后她抬起头，直直看向<user>。',prompt:'你选择「站台·来客」开局。你是初抵海鸣的外来访客，刚下电车便目击异象。请按上述开场继续：<user> 刚抵达便撞见奈叶与尤诺追向闪光。请展开后续。'},{id:'school',title:'学校·窗边',subtitle:'上课铃响前的走廊，爆炸声震碎午后的平静',group:'海鸣日常',icon:'fa-school',accent:'#8fbfa0',patch:{'主角.身份设定':'海鸣市居民（学生）','主角.立场':'先观望','主角.状态':'健康','世界.当前地点':'圣祥大学附属小学'},text:'下午第一节刚下课，走廊里挤满了说笑的学生。\n\n<user>正靠在教室后门边的窗台，手里转着一支笔，看着楼下绿茵场发呆。午后的天空干净得发白，可就在<user>收回视线的那一瞬——\n\n窗外的空气猛地一抖。\n\n一声沉闷的、像是有什么重物砸进地面的炸响从校园另一头传来，震得玻璃嗡嗡作响。走廊里几个学生停下脚步，探头往窗外看；远处操场尽头的树林方向，扬起一阵不正常的尘土，风里似乎夹着一丝焦糊的气味。\n\n广播随即响了起来：「请各位同学回到教室，不要外出——」\n\n<user>没动。因为<user>看见了别人没看见的东西：在操场尽头的树梢上方，一团青色的小光球一闪而过，迅速坠入林间，像颗不安分的流星。\n\n而就在下楼的方向，一个不属于本校的低年级女生正逆着人流快步往前跑。她穿着陌生的外套，怀里抱着根银白短棒，肩头趴着一只棕色雪貂。她拐向操场的方向，正是光球落下的地方。\n\n上课铃在这时响起。\n\n是回到教室，还是跟上那个不该出现在这里的身影？',prompt:'你选择「学校·窗边」开局。你是海鸣市的在校生，午后目击异象与陌生女孩。请按上述开场继续：<user> 目睹奈叶追向他校方向的异常。请展开后续。'}],k={class:'picker'},y={class:'opening-grid'},j=['disabled','onClick'],w={class:'op-group'},C={class:'op-title'},S={class:'op-sub'},M={class:'custom-area'},B=['disabled'],x={class:'form-card'},A={class:'field'},D={class:'field'},P={class:'field'},U={class:'form-actions'},I=['disabled'],R=['disabled'],q=(0,s.defineComponent)({__name:'App',setup(e){const a=v(),r=(0,s.ref)('menu'),o=(0,s.ref)(!1),l=(0,s.ref)('海鸣市居民'),c=(0,s.ref)('偶然目击'),i=(0,s.ref)('想帮忙');function u(e){o.value||(o.value=!0,function(e){for(const[t,n]of Object.entries(e)){const e=t.split('.');let r=a.data;for(let t=0;t<e.length-1;t++)r=r?.[e[t]];void 0!==r&&(r[e[e.length-1]]=n)}}(e.patch),t([{role:'assistant',message:e.text}]).then(()=>{t([{role:'user',message:e.prompt}]).then(()=>{n('/trigger')})}))}function d(){if(o.value)return;o.value=!0,a.data.主角.身份设定=l.value,a.data.主角.立场=i.value,a.data.世界.当前地点='海鸣市';const e=`我是${l.value}，${c.value}了海鸣市黄昏时的异象。我选择${i.value}。请根据我的身份、卷入方式和立场，展开我的开场。`;t([{role:'user',message:e}]
